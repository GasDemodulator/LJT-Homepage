name: Validate Jekyll build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: "3.1"
          bundler-cache: true
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Verify generated homepage and publications
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/publications/index.html
          test -f _site/publications/synlogic/index.html

          for term in \
            "Junteng Liu" \
            "First-year PhD candidate" \
            "Academic Background" \
            "Research Experience" \
            "Skills and Research Interests" \
            "Publications" \
            "Contact Information" \
            "SynLogic" \
            "On the Perception Bottleneck of VLMs for Chart Understanding" \
            "On the Universal Truthfulness Hyperplane Inside LLMs" \
            "In-Context Sharpness as Alerts" \
            "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models" \
            "Composing Parameter-Efficient Modules with Arithmetic Operations" \
            "jliugi@connect.ust.hk" \
            "Vicent0205" \
            "tbK9jl4AAAAJ" \
            "junteng88716710"; do
            grep -Fq "$term" _site/index.html
            grep -Fq "$term" _site/publications/index.html || test "$term" = "Academic Background" || test "$term" = "Research Experience" || test "$term" = "Skills and Research Interests" || test "$term" = "Contact Information" || test "$term" = "jliugi@connect.ust.hk" || test "$term" = "Vicent0205" || test "$term" = "tbK9jl4AAAAJ" || test "$term" = "junteng88716710"
          done

          if grep -q "Paper Title Number" _site/index.html _site/publications/index.html; then
            echo "Template publication content remains in generated pages." >&2
            exit 1
          fi
          if test -e _site/publication; then
            echo "Old template publication detail output remains." >&2
            find _site/publication -maxdepth 2 -type f -print >&2
            exit 1
          fi
